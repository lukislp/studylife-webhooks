# Default-deny in BOTH directions as the baseline (default-deny-ingress and
# default-deny-egress), with every allowed flow spelled out as its own policy: cluster DNS in
# allow-dns, the delivery pod's outbound reach in studylife-webhooks-egress (target_urls are
# arbitrary user input, so that one is scoped by destination RANGE rather than by host), and
# the two inbound paths below. Bootstrap-only, NOT Flux-managed - same RBAC reasoning as
# k8s/00-namespace.yaml/k8s/02-secret.yaml (kustomize-controller's ClusterRole has no
# "networkpolicies" permission).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: studylife-webhooks
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: studylife-webhooks
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# studylife-scale has no default-deny egress (see that namespace's own k8s/12-network-
# policies.yaml header comment), so studylife-web can already reach out cross-namespace by
# default - this rule is the only side that needs to explicitly allow anything. Only
# studylife-web calls WebhooksProxyClient (see that repo's grep for PublishEventAsync/
# WebhooksProxyClient - no worker call site), so studylife-worker is deliberately not admitted
# here, unlike studylife-ai's allow-studylife-to-internal-port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-web-to-app
  namespace: studylife-webhooks
spec:
  podSelector: { matchLabels: { app: studylife-webhooks } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-web } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Lets the existing self-hosted Prometheus (studylife repo's k8s/14-prometheus.yaml) scrape
# /metrics - it reaches pods directly (kubernetes_sd_configs, role: pod), not through any
# Ingress/Gateway path, so this is the only allowance /metrics needs. Same podSelector-scoped
# pattern as studylife-mcp's own k8s/05-network-policies.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-studylife-webhooks
  namespace: studylife-webhooks
spec:
  podSelector: { matchLabels: { app: studylife-webhooks } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: prometheus } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Egress for the delivery pod. This service's whole job is POSTing to a user-configured
# target_url (delivery.deliver_one) - an arbitrary URL stored per registration, never
# validated against a scheme, host or port allowlist (see db.create_webhook). There is no
# host list that could be enumerated here, so egress is scoped by DESTINATION RANGE instead
# of by host:
#
#  1. Ports 80/443 to anywhere, including the LAN - the standard case for a subscriber
#     endpoint (Zapier, n8n, Discord, a self-hosted automation on the local network).
#  2. Every other port to anywhere EXCEPT this cluster's own pod network (10.42.0.0/16),
#     its Service network (10.43.0.0/16) and the node/LAN subnet (192.168.20.0/24) - so a
#     subscriber listening on a non-standard port (e.g. :8443, :5678) still works, while a
#     compromised pod cannot use the same freedom to reach the other namespaces' databases,
#     the kubelets or the Kubernetes API. Those three ranges are exactly what the old bare
#     "- {}" egress rule left wide open.
#
# This service makes no calls to StudyLife at all: traffic with StudyLife is inbound only
# (studylife-web POSTs /internal/events, see allow-studylife-web-to-app above). DNS is
# covered by allow-dns; kubelet probes are not subject to NetworkPolicy at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studylife-webhooks-egress
  namespace: studylife-webhooks
spec:
  podSelector: { matchLabels: { app: studylife-webhooks } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["10.42.0.0/16", "10.43.0.0/16", "192.168.20.0/24"]
---
# Egress counterpart of the ingress baseline above: a pod in this namespace gets no outbound
# access at all beyond what an explicit policy grants it (allow-dns for cluster DNS, plus the
# per-app egress policy in this file). Until 2026-09-13 allow-dns carried a bare "- {}" rule
# next to its DNS rule, which allowed egress to anywhere - the internet, every other namespace
# and the node network - making the policy a no-op in practice. This baseline replaces it, so
# a pod added here later is denied by default instead of inheriting that hole.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: studylife-webhooks
spec:
  podSelector: {}
  policyTypes: ["Egress"]
