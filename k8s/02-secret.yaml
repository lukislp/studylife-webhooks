# NOTE: placeholder only - the REAL values live next to this file in k8s/02-secret-sealed.yaml,
# a SealedSecret encrypted for this cluster's sealed-secrets controller (that is the file to
# apply: kubectl apply -f k8s/02-secret-sealed.yaml). Applying THIS file would overwrite the
# live Secret with the dummy values below, so don't - it is kept purely as documentation of
# which keys exist and what each one is for, and for deployments outside this cluster.
#
# IMPORTANT: the value below is an obvious placeholder, publicly visible in this repo - never
# use it like this in a real cluster. For a real deployment, create this Secret out of band
# (kubectl create secret / a secret manager) with a real value, then apply everything else here.
# Same convention as studylife-ai's own k8s/02-secret.yaml and studylife's own
# k8s/01-config-and-secret.yaml.
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole grants no permission on
# the "secrets" resource at all (see k8s/00-namespace.yaml's header comment on least-privilege
# scoping). Applied once by hand (kubectl apply -f k8s/02-secret.yaml) with the real value
# substituted first.
apiVersion: v1
kind: Secret
metadata:
  name: studylife-webhooks-secrets
  namespace: studylife-webhooks
type: Opaque
stringData:
  # MUST match the studylife repo's own StudyLifeWebhooks:SharedSecret exactly (see
  # WebhooksProxyClient there and require_shared_secret in this repo's main.py) - it's the one
  # thing that authenticates every /internal/* call as genuinely coming from StudyLife.
  STUDYLIFE_WEBHOOKS_SHARED_SECRET: "REPLACE-ME"
