# The service itself. Image tag is a placeholder ("0.1.0") overwritten by Flux's
# ImageUpdateAutomation (k8s/flux/04-image-update-automation.yaml) the moment it first
# reconciles against a real published tag - mirrors studylife-ai's own k8s/04-app.yaml. This
# repo's Dockerfile creates "appuser" with an explicit numeric --uid 1000, so
# runAsNonRoot/runAsUser is safe here without live inspection.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studylife-webhooks-data
  namespace: studylife-webhooks
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml) instead of
  # local-path - webhooks.db survives a node dying instead of needing a Velero restore.
  storageClassName: longhorn
  resources:
    requests: {storage: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylife-webhooks
  namespace: studylife-webhooks
spec:
  replicas: 1
  strategy:
    # Single instance with an RWO volume (webhooks.db is a plain SQLite file, not built for
    # concurrent writers) - same reasoning as studylife-ai/qdrant/uptime-kuma.
    type: Recreate
  selector:
    matchLabels: {app: studylife-webhooks}
  template:
    metadata:
      labels: {app: studylife-webhooks}
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup: /app/data holds every user's
        # webhook registrations (target_url/events/secret). Borderline-valuable, but the backup
        # costs kilobytes. Crash-consistent copy, accepted like studylife-ai's own data volume.
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Makes the PVC mount group-writable by UID 1000 on first mount - without this, a
        # freshly-provisioned PersistentVolume is root-owned and the non-root container gets
        # "Permission denied" writing to /app/data/webhooks.db.
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studylife-webhooks
          image: ghcr.io/lukislp/studylife-webhooks:1.2.24 # set by the deploy-bump job (CI) on every release
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            # Everything this service persists is webhooks.db on the PVC below; the image
            # layer is never written to. /tmp still has to be writable because that is where
            # Python's tempfile module and the HTTP client put their scratch files.
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef: {name: studylife-webhooks-config}
            - secretRef: {name: studylife-webhooks-secrets}
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          # Both probes set timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for the arm64 Raspberry Pi nodes this runs on: the weakest node sits close
          # to its memory limit, so an ordinary load spike pushes /health past one second,
          # the liveness probe fails failureThreshold times in a row and kubelet restarts a
          # container that was only busy.
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: studylife-webhooks-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: studylife-webhooks
  namespace: studylife-webhooks
spec:
  type: ClusterIP
  selector: {app: studylife-webhooks}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
