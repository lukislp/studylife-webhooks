[project]
name = "studylife-webhooks"
version = "0.1.0"
description = "Webhook delivery microservice for StudyLife: fires signed HTTP callbacks on session/goal events to your own automations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
# Fuzzing harness (fuzz/), Linux only - the atheris wheel does not exist for Windows.
fuzz = [
    "atheris>=2.3",
]
dev = [
    # Starlette 1.6 deprecates its TestClient over httpx and warns on every test run until
    # httpx2 is installed.
    "httpx2>=2.12",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["studylife_webhooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studylife_webhooks"]
